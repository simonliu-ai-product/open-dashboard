name: Upcoming release

# Keeps everyone told what the next release holds:
# - every push to nightly rewrites the pinned "Upcoming release" issue;
# - every pull request merged into nightly gets a comment naming the version
#   it is planned for.
# Nothing here publishes anything.

on:
  push:
    branches: [nightly]
  pull_request:
    types: [closed]
    branches: [nightly]

concurrency:
  group: upcoming-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  issue:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: upcoming-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Write the issue body
        run: node scripts/upcoming-release.mjs --issue > "$RUNNER_TEMP/upcoming.md"
      - name: Create or update the issue
        run: |
          gh label create "$LABEL" --color 0E8A16 --description "What the next release holds" 2>/dev/null || true
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            url=$(gh issue create --title "Upcoming release" --label "$LABEL" --body-file "$RUNNER_TEMP/upcoming.md")
            gh issue pin "$url" || true
          else
            gh issue edit "$number" --body-file "$RUNNER_TEMP/upcoming.md"
          fi

  comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nightly
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Say which version it ships in
        run: |
          files=$(gh pr view "$PR" --json files --jq '[.files[].path | select(test("^\\.changeset/.+\\.md$")) | select(. != ".changeset/README.md")] | join(",")')
          node scripts/upcoming-release.mjs --comment --files "$files" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
